<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportsFlyer Studio</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#eaf1ff;background:#080f1d}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #27334a;display:flex;justify-content:space-between;align-items:center;background:#101b2e}header strong{font-size:22px}header span{color:#65bfff}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;max-width:1400px;margin:auto;padding:22px}.panel{background:#131f32;border:1px solid #293953;border-radius:16px;padding:20px}.panel h2{margin:0 0 18px;font-size:18px}.field{margin-bottom:13px}label{display:block;font-size:12px;color:#a9bbd4;margin-bottom:5px;font-weight:650}input,select,textarea{width:100%;border:1px solid #34445d;border-radius:9px;padding:11px;color:white;background:#0b1526;font:inherit}textarea{resize:vertical;min-height:70px}input[type=color]{height:44px;padding:3px}input[type=file]{font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{background:#53b5ff;border:0;border-radius:9px;padding:12px 16px;color:#041326;font-weight:800;cursor:pointer}button.secondary{background:#273a55;color:#eaf1ff}.preview{display:flex;flex-direction:column;align-items:center;gap:15px}.preview canvas{width:min(100%,540px);height:auto;box-shadow:0 24px 65px #0008;border-radius:5px}.hint{color:#9eafc7;font-size:12px;text-align:center;line-height:1.5}.template-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.template-row button{padding:8px 10px;background:#273a55;color:white;font-size:12px}.template-row button.active{background:#53b5ff;color:#071527}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}.panel{padding:16px}header{padding:14px}header strong{font-size:18px}}
</style></head><body><header><strong>SPORTS<span>FLYER</span> STUDIO</strong><small>Free template-based flyer creator</small></header><main><section class="panel"><h2>Customize your flyer</h2><label>Design</label><div class="template-row" id="templates"></div><div class="field"><label>Headline</label><input id="headline" value="BASEBALL TRYOUTS"></div><div class="two"><div class="field"><label>Team name</label><input id="team" value="GS BASEBALL"></div><div class="field"><label>Age group</label><input id="age" value="8U KID-PITCH"></div></div><div class="two"><div class="field"><label>Date</label><input id="date" value="DECEMBER 6"></div><div class="field"><label>Time</label><input id="time" value="2:00 PM"></div></div><div class="field"><label>Location</label><input id="location" value="BUTLER, GEORGIA"></div><div class="field"><label>Additional details</label><textarea id="details">LOOKING FOR PLAYERS READY TO COMPETE, DEVELOP, AND RAISE THE STANDARD!</textarea></div><div class="field"><label>Footer / motto</label><input id="footer" value="HIGHER STANDARDS. NO EXCUSES."></div><div class="two"><div class="field"><label>Primary color</label><input id="primary" type="color" value="#55b9f6"></div><div class="field"><label>Secondary color</label><input id="secondary" type="color" value="#071b38"></div></div><div class="field"><label>Team logo (optional, stays unmodified)</label><input id="logo" type="file" accept="image/*"></div><div class="field"><label>Background photo (optional)</label><input id="photo" type="file" accept="image/*"></div><div class="buttons"><button id="download">Download PNG</button><button id="reset" class="secondary">Reset</button></div><p class="hint">Runs locally in your browser. No AI account, API key, or per-flyer generation fee. Upload images you have permission to use.</p></section><section class="preview"><canvas id="flyer" width="1080" height="1350" aria-label="Live flyer preview"></canvas><div class="hint">1080 × 1350 px · Live preview · Social-media ready</div></section></main><script>
const canvas=document.getElementById('flyer'),c=canvas.getContext('2d'),ids=['headline','team','age','date','time','location','details','footer','primary','secondary'],defaults=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));let template='stadium',logo=null,photo=null;
const templates=[['stadium','Stadium Lights'],['electric','Electric'],['classic','Classic'],['minimal','Clean']];
function choose(t){template=t;document.getElementById('templates').innerHTML=templates.map(([key,name])=>'<button type="button" data-template="'+key+'" class="'+(key===template?'active':'')+'">'+name+'</button>').join('');document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>choose(b.dataset.template));render()}
function val(id){return document.getElementById(id).value.trim()}function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}function line(x,y,X,Y,color,width=3){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}function cover(img,x,y,w,h){const s=Math.max(w/img.width,h/img.height),sw=img.width*s,sh=img.height*s;c.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh)}
function fit(text,maxWidth,size,min=28){c.font='900 '+size+'px Impact,Arial Black,sans-serif';while(c.measureText(text).width>maxWidth&&size>min){size-=2;c.font='900 '+size+'px Impact,Arial Black,sans-serif'}return size}
function text(t,x,y,size,color='#fff',align='center',max=980){c.textAlign=align;c.textBaseline='middle';c.fillStyle=color;fit(t,max,size);c.fillText(t,x,y)}
function wrap(t,maxWidth,size){c.font='800 '+size+'px Arial,sans-serif';let out=[],row='';for(const word of t.split(/\s+/)){const next=row?row+' '+word:word;if(c.measureText(next).width>maxWidth&&row){out.push(row);row=word}else row=next}if(row)out.push(row);return out.slice(0,5)}
function render(){const p=val('primary'),s=val('secondary'),W=1080,H=1350;c.clearRect(0,0,W,H);const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,template==='minimal'?'#15233b':'#061225');bg.addColorStop(1,s);rect(0,0,W,H,bg);if(photo){c.save();c.globalAlpha=.42;cover(photo,0,0,W,H);c.restore()}
if(template==='stadium'||template==='electric'){for(let i=0;i<2;i++){let x=i?1030:50;const g=c.createRadialGradient(x,130,5,x,130,400);g.addColorStop(0,'#ffffffaa');g.addColorStop(.13,p+'88');g.addColorStop(1,'#ffffff00');rect(i?600:0,0,480,550,g);for(let a=0;a<5;a++)for(let b=0;b<3;b++){c.beginPath();c.arc(x+(i?-1:1)*a*25,65+b*28,8,0,7);c.fillStyle='#f5faff';c.fill()}}}
if(template==='electric'){for(let i=0;i<17;i++){line(-90+i*95,420,140+i*95,70,p,i%3===0?9:3)}}if(template==='classic'){for(let i=0;i<13;i++){line(0,110+i*18,1080,20+i*18,p+'55',4)}}if(template==='minimal'){rect(0,0,1080,22,p);rect(0,1325,1080,25,p)}
c.save();c.translate(540,405);c.rotate(-.065);rect(-590,-10,1180,190,p);rect(-590,155,1180,12,'#ffffff');c.restore();
if(logo){const w=260,h=215,scale=Math.min(w/logo.width,h/logo.height);c.drawImage(logo,540-logo.width*scale/2,45,logo.width*scale,logo.height*scale)}else{text('★',540,135,110,p)}
text(val('team').toUpperCase(),540,285,88,'#fff','center',1000);text(val('headline').toUpperCase(),540,475,122,s,'center',1020);
rect(220,570,640,82,s);text(val('age').toUpperCase(),540,611,55,p);
line(110,720,970,720,p,5);text(val('date').toUpperCase(),540,805,94,'#fff');text(val('time').toUpperCase(),540,897,82,p);text(val('location').toUpperCase(),540,995,61,'#fff');
line(110,1050,970,1050,p,4);const lines=wrap(val('details').toUpperCase(),920,37);lines.forEach((t,i)=>text(t,540,1100+i*45,37,'#fff'));rect(0,1260,1080,90,p);text(val('footer').toUpperCase(),540,1305,47,s,'center',1010)}
ids.forEach(id=>document.getElementById(id).addEventListener('input',render));function loadImage(id,callback){document.getElementById(id).addEventListener('change',e=>{const f=e.target.files[0];if(!f){callback(null);render();return}if(!f.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{callback(img);render()};img.src=reader.result};reader.readAsDataURL(f)})}loadImage('logo',x=>logo=x);loadImage('photo',x=>photo=x);
document.getElementById('download').onclick=()=>{render();const a=document.createElement('a');a.download='sports-flyer.png';a.href=canvas.toDataURL('image/png');a.click()};document.getElementById('reset').onclick=()=>{ids.forEach(id=>document.getElementById(id).value=defaults[id]);logo=null;photo=null;document.getElementById('logo').value='';document.getElementById('photo').value='';choose('stadium')};choose('stadium');
</script></body></html>
