<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Flyer Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f1b;color:#f4f8ff;font:15px system-ui,Arial}header{padding:16px 22px;background:#132139;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:0}.app{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 70px)}aside{background:#111d31;padding:20px;overflow:auto;max-height:calc(100vh - 70px)}main{background:radial-gradient(#203d5d,#070b12);display:flex;justify-content:center;align-items:center;padding:24px}label{display:block;color:#bdd5ed;font-weight:700;font-size:12px;margin:12px 0 5px}input:not([type=file]):not([type=color]),select,textarea{width:100%;padding:10px;background:#0a1322;border:1px solid #415773;border-radius:7px;color:white;font:inherit}input[type=color]{width:100%;height:38px}input[type=range]{width:100%}textarea{height:65px}button{border:0;background:#55caff;color:#06111d;font-weight:800;border-radius:8px;padding:12px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.preview{width:min(100%,550px);box-shadow:0 15px 60px #000b}canvas{display:block;width:100%;height:auto}details{margin-top:16px;border-top:1px solid #3c516a;padding-top:12px}summary{font-weight:800;cursor:pointer}.note{font-size:12px;color:#a4bbd2}@media(max-width:800px){.app{grid-template-columns:1fr}aside{max-height:none}main{padding:12px}}
</style></head><body><header><h1>⚡ Sports Flyer Studio</h1><button id="exportTop">Export PNG</button></header><div class="app"><aside>
<label>Flyer type</label><select id="template"><option value="8U TRYOUTS">Tryouts</option><option value="OPEN PRACTICE">Open Practice</option><option value="TOURNAMENT">Tournament</option><option value="TEAM ANNOUNCEMENT">Announcement</option><option value="FUNDRAISER">Fundraiser</option></select>
<label>Team name</label><input id="team" value="GS BASEBALL"><label>Main headline</label><input id="headline" value="8U TRYOUTS"><label>Tagline</label><input id="tagline" value="HIGHER STANDARDS. NO EXCUSES."><label>Season / subtitle</label><input id="subtitle" value="SPRING 2027"><label>Date</label><input id="date" value="DECEMBER 6 & 12, 2026"><label>Time</label><input id="time" value="2:00 PM / 10:00 AM"><label>Location</label><textarea id="location">BUTLER, GA & MACON, GA</textarea><label>Contact</label><input id="contact" value="TEXT (478) 960-4245"><label>Website</label><input id="website" value="tryouts.stingerz-baseball.com">
<details open><summary>Colors and effects</summary><label>Primary color</label><input id="accent" type="color" value="#55caff"><label>Secondary color</label><input id="secondary" type="color" value="#ff9d75"><label>Background</label><select id="theme"><option value="stadium">Night stadium</option><option value="grunge">Grunge</option><option value="clean">Clean dark</option></select><label>Headline size</label><input id="size" type="range" min="85" max="175" value="145"></details>
<details open><summary>Upload images</summary><label>Team logo</label><input id="logo" type="file" accept="image/*"><label>Background photo</label><input id="photo" type="file" accept="image/*"><label>Photo opacity</label><input id="opacity" type="range" min="0" max="100" value="35"></details>
<details><summary>Export size</summary><select id="resolution"><option value="1080">1080 × 1350 (social)</option><option value="2160">2160 × 2700 (high-res)</option><option value="3240">3240 × 4050 (print)</option></select></details><br><div class="actions"><button id="download">Download PNG</button><button id="save">Save Design</button><button id="load">Load Design</button></div><p class="note">Live preview. Files and saved designs stay in your browser.</p>
</aside><main><div class="preview"><canvas id="canvas" width="1080" height="1350"></canvas></div></main></div><script>
const $=id=>document.getElementById(id),fields=['team','headline','tagline','subtitle','date','time','location','contact','website','accent','secondary','theme','size','opacity'];let logo,photo;const c=$('canvas'),ctx=c.getContext('2d');
function fit(t,s,max=940){ctx.font='900 '+s+'px Impact,Arial Black,sans-serif';while(ctx.measureText(t).width>max&&s>24){s-=2;ctx.font='900 '+s+'px Impact,Arial Black,sans-serif'}return s}
function txt(t,y,s,color,outline){t=String(t).toUpperCase();s=fit(t,s);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+s+'px Impact,Arial Black,sans-serif';if(outline){ctx.lineWidth=Math.max(4,s*.08);ctx.lineJoin='round';ctx.strokeStyle=outline;ctx.strokeText(t,540,y)}ctx.fillStyle=color;ctx.fillText(t,540,y);ctx.restore()}
function stripe(y,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,y+35);ctx.lineTo(1080,y);ctx.lineTo(1080,y+h-35);ctx.lineTo(0,y+h);ctx.fill()}
function render(){let a=$('accent').value,b=$('secondary').value,t=$('theme').value;let g=ctx.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#12375b');g.addColorStop(.5,'#07182d');g.addColorStop(1,'#040911');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);if(photo){ctx.globalAlpha=+$('opacity').value/100;ctx.drawImage(photo,0,0,1080,1350);ctx.globalAlpha=1;ctx.fillStyle='#06142677';ctx.fillRect(0,0,1080,1350)}if(t!=='clean'){let seed=17;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<145;i++){let x=rand()*1080,y=rand()*1350;ctx.strokeStyle=i%4===0?b:a;ctx.globalAlpha=.2+rand()*.45;ctx.lineWidth=1+rand()*6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+60+rand()*250,y-15-rand()*45);ctx.stroke()}ctx.globalAlpha=1;if(t==='stadium')for(let x of [100,980]){let glow=ctx.createRadialGradient(x,150,2,x,150,180);glow.addColorStop(0,'#ffffffc9');glow.addColorStop(1,'#ffffff00');ctx.fillStyle=glow;ctx.fillRect(x-180,0,360,360);for(let i=0;i<4;i++)for(let j=0;j<4;j++){ctx.fillStyle='#fff';ctx.fillRect(x-38+i*23,115+j*23,10,10)}}}stripe(275,155,'#000b');stripe(725,110,'#000c');ctx.fillStyle=a;ctx.fillRect(0,0,1080,10);ctx.fillRect(0,1340,1080,10);if(logo){let z=Math.min(270/logo.width,195/logo.height);ctx.drawImage(logo,65,40,logo.width*z,logo.height*z)}else txt($('team').value,120,76,a,'#000');txt($('tagline').value,270,54,'#fff','#000');ctx.fillStyle=a;ctx.fillRect(90,338,900,6);let parts=$('headline').value.toUpperCase().split(' ');if(parts.length>1){txt(parts.slice(0,-1).join(' '),490,+$('size').value,a,'#06111d');txt(parts.at(-1),630,+$('size').value,'#fff','#06111d')}else txt(parts[0],550,+$('size').value,a,'#06111d');stripe(745,90,a);txt($('subtitle').value,783,62,'#061321');txt($('date').value,915,70,'#fff','#000');txt($('time').value,1010,76,a,'#000');$('location').value.split('\n').slice(0,2).forEach((v,i)=>txt(v,1095+i*50,43,'#fff'));ctx.fillStyle=b;ctx.fillRect(100,1172,880,5);txt($('contact').value,1225,40,'#fff');txt($('website').value,1290,34,a)}
function imageFile(id,cb){let f=$(id).files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{cb(i);render()};i.src=r.result};r.readAsDataURL(f)}
fields.forEach(id=>$(id).addEventListener('input',render));$('logo').onchange=()=>imageFile('logo',i=>logo=i);$('photo').onchange=()=>imageFile('photo',i=>photo=i);$('template').onchange=()=>{$('headline').value=$('template').value;render()};
function download(){let w=+$('resolution').value,out=document.createElement('canvas');out.width=w;out.height=w*1.25;out.getContext('2d').drawImage(c,0,0,out.width,out.height);let a=document.createElement('a');a.download='sports-flyer.png';a.href=out.toDataURL('image/png');a.click()}
$('download').onclick=download;$('exportTop').onclick=download;$('save').onclick=()=>{localStorage.setItem('sportsFlyerDesign',JSON.stringify(Object.fromEntries(fields.map(id=>[id,$(id).value]))));alert('Design saved')};$('load').onclick=()=>{let d=JSON.parse(localStorage.getItem('sportsFlyerDesign')||'null');if(!d)return alert('No saved design');fields.forEach(id=>{if(d[id]!==undefined)$(id).value=d[id]});render()};render();
</script></body></html>
